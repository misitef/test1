<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b1026" />
<meta name="description" content="立冬 · 添望 —— 一支 90 秒的竖屏小动画" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1026'/%3E%3Ccircle cx='16' cy='13' r='6' fill='%23e8ecf8'/%3E%3C/svg%3E" />
<title>立冬 · 添望</title>
<style>
/* ============================================================
   立冬 · 添望   V7.3 · 90s 十幕
   单文件 · 素材全部可选 · 9:16 自适应
   1u = 竖屏舞台宽度的 1%（舞台 100u × 177.78u）
   ============================================================ */
:root{
  --sky-0:#0b1026;
  --sky-1:#1a1f3d;
  --ink:#e8ecf8;
  --jt:#cfe8ff;
  --sw:#ffd98e;
  --vh:100vh;
  --u:calc(min(100vw, calc(var(--vh) * .5625)) / 100);
  --px:0px;
  --py:0px;
}
@supports (height:100dvh){ :root{ --vh:100dvh; } }

*,*::before,*::after{ box-sizing:border-box; }
html,body{
  height:100%; margin:0; overflow:hidden;
  overscroll-behavior:none;
  background:#04060e;
}
body{
  display:grid; place-items:center;
  color:var(--ink);
  font-family:'STKaiti','KaiTi','Kaiti SC','STSong','Songti SC','SimSun',serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

.stage{
  position:relative;
  width:calc(var(--u) * 100);
  height:calc(var(--u) * 177.78);
  overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0%, #131a38 0%, var(--sky-0) 46%, #070a18 100%);
  isolation:isolate;
}
.stage.shake{ animation:shake200 .22s ease-in-out 1; }
@keyframes shake200{
  0%,100%{ transform:translate3d(0,0,0); }
  22%{ transform:translate3d(-.7u,-.35u,0) rotate(-.12deg); }
  55%{ transform:translate3d(.6u,.3u,0) rotate(.1deg); }
  80%{ transform:translate3d(-.25u,.12u,0); }
}

/* 缓慢推近，全片都在动 */
.world{
  position:absolute; inset:0;
  transform-origin:50% 62%;
  animation:worldDrift 92s cubic-bezier(.2,.5,.4,1) forwards;
  will-change:transform;
}
@keyframes worldDrift{
  from{ transform:scale(1.02); }
  to  { transform:scale(1.075); }
}

/* ---------- 天 ---------- */
.sky{
  position:absolute; inset:0;
  background:
    radial-gradient(58% 38% at 16% 70%, rgba(255,217,142,.05), transparent 72%),
    radial-gradient(66% 44% at 82% 18%, rgba(150,175,255,.08), transparent 72%),
    linear-gradient(180deg, rgba(11,16,38,0) 34%, rgba(26,31,61,.42) 72%, rgba(36,44,80,.62) 100%);
  transition:opacity 2.4s ease;
}
.stars{ position:absolute; inset:0; opacity:.9; }
.stars i{
  position:absolute; border-radius:50%; background:#eaf2ff;
  box-shadow:0 0 calc(var(--u) * .55) rgba(200,220,255,.7);
  opacity:var(--o,.5);
  animation:twinkle 5s ease-in-out infinite alternate;
}
@keyframes twinkle{
  from{ opacity:calc(var(--o,.5) * .3); transform:scale(.85); }
  to  { opacity:var(--o,.5); transform:scale(1); }
}

.moon{
  position:absolute; right:13%; top:6.4%;
  width:calc(var(--u) * 7.2); height:calc(var(--u) * 7.2);
  border-radius:50%;
  background:radial-gradient(circle at 40% 36%,
    rgba(255,253,246,.98) 0%, rgba(250,247,238,.96) 44%,
    rgba(234,232,224,.88) 66%, rgba(214,224,242,.30) 86%,
    rgba(210,222,245,0) 100%);
  box-shadow:0 0 calc(var(--u) * 4) rgba(255,250,232,.20),
             0 0 calc(var(--u) * 12) rgba(196,216,255,.12);
  opacity:.9;
  filter:blur(calc(var(--u) * .18));
  transition:opacity 2s ease;
}
.moon::before{
  content:''; position:absolute; inset:calc(var(--u) * -9);
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(232,240,255,.16) 0%, rgba(214,228,255,.08) 34%, rgba(210,220,240,0) 68%);
  filter:blur(calc(var(--u) * 1.2));
}

.haze{
  position:absolute; left:-4%; right:-4%; bottom:6%; height:40%;
  background:
    radial-gradient(54% 100% at 44% 100%, rgba(255,222,160,.13), transparent 66%),
    radial-gradient(46% 100% at 74% 100%, rgba(160,190,255,.09), transparent 70%);
  filter:blur(calc(var(--u) * 1.4));
  transition:opacity 2s ease;
}

/* ---------- 照片（原图上下有黑边，靠放大把中间那条画面铺满） ---------- */
.photo{
  position:absolute; inset:0;
  z-index:1;
  background-repeat:no-repeat;
  background-position:center center;
  background-size:320% auto;
  opacity:0;
  transition:opacity 2.6s ease;
  -webkit-mask-image:radial-gradient(128% 96% at 50% 48%, #000 40%, rgba(0,0,0,.72) 68%, transparent 100%);
          mask-image:radial-gradient(128% 96% at 50% 48%, #000 40%, rgba(0,0,0,.72) 68%, transparent 100%);
  will-change:opacity;
}
.photo::after{
  content:''; position:absolute; inset:0;
  background:
    linear-gradient(180deg, rgba(5,8,18,.97) 0%, rgba(5,8,18,.72) 7%, rgba(5,8,18,.22) 19%, rgba(5,8,18,.04) 30%, rgba(5,8,18,.06) 68%, rgba(5,8,18,.58) 86%, rgba(5,8,18,.96) 100%),
    radial-gradient(120% 86% at 50% 50%, transparent 36%, rgba(5,8,18,.55) 78%, rgba(5,8,18,.9) 100%);
}
.photo.on{ opacity:1; }
#phBalcony{ background-image:url("bg_balcony.jpg"); filter:saturate(1.12) contrast(1.02) brightness(1.04); }
#phCity{ background-image:url("bg_nightcity.jpg"); filter:saturate(.98) contrast(1.04) brightness(1.02); }

/* 冷暖染色层：叙事用 */
.grade{
  position:absolute; inset:0; pointer-events:none;
  mix-blend-mode:soft-light;
  opacity:0;
  transition:opacity 2.2s ease;
}

/* ---------- 地 ---------- */
.ground{
  position:absolute; left:-6%; right:-6%; bottom:0; height:27%;
  background:linear-gradient(180deg, rgba(9,13,30,0) 0%, #0a1024 34%, #070a18 100%);
  transition:opacity 1.6s ease;
}
.ground::before{
  content:''; position:absolute; left:0; right:0; top:-9%; height:30%;
  background:
    radial-gradient(46% 100% at 34% 100%, rgba(216,232,255,.17), transparent 72%),
    radial-gradient(42% 100% at 70% 100%, rgba(216,232,255,.13), transparent 74%);
  filter:blur(calc(var(--u) * 1.1));
  border-radius:50% 50% 0 0 / 90% 90% 0 0;
}
.ground::after{
  content:''; position:absolute; left:0; right:0; bottom:0; height:44%;
  background:linear-gradient(180deg, rgba(200,222,255,.05), rgba(200,222,255,0));
}
.pool{
  position:absolute; left:4%; right:4%; bottom:-4%; height:36%;
  background:
    radial-gradient(44% 58% at 47% 58%, rgba(255,222,164,.15), rgba(255,217,142,.055) 46%, transparent 76%),
    radial-gradient(58% 46% at 50% 92%, rgba(190,214,255,.07), transparent 72%);
  filter:blur(calc(var(--u) * 3.2));
  mix-blend-mode:screen;
  transition:opacity 1.6s ease, filter 1.6s ease;
}

/* ---------- 路灯 ---------- */
.lamp{
  position:absolute; left:8.5%; bottom:11.5%;
  z-index:5;
  transition:opacity 1.8s ease, filter 1.6s ease;
  width:calc(var(--u) * 50);
  aspect-ratio:420 / 760;
  z-index:2;
  transition:filter 2.4s ease, opacity 1.4s ease;
}
.lamp svg{ width:100%; height:100%; display:block; overflow:visible; }
.lamp-core{ animation:glowPulse 6.5s ease-in-out infinite; transform-origin:336px 214px; }
@keyframes glowPulse{
  0%,100%{ opacity:.46; }
  50%    { opacity:.64; }
}
.lamp.ignite .lamp-core{ animation:ignite 1.4s ease-out 1; }
@keyframes ignite{
  0%{ opacity:0; transform:scale(.4); }
  18%{ opacity:1; transform:scale(1.25); }
  30%{ opacity:.2; }
  46%{ opacity:1; transform:scale(1.02); }
  100%{ opacity:.5; transform:scale(1); }
}

/* ---------- 梧桐 ---------- */
.tree{
  position:absolute; right:-11%; bottom:10%;
  width:calc(var(--u) * 60);
  aspect-ratio:520 / 760;
  z-index:5;
  filter:drop-shadow(0 0 calc(var(--u) * 2) rgba(0,0,0,.6));
  transition:opacity 1.4s ease, transform 1.2s ease;
}
.tree svg{ width:100%; height:100%; display:block; overflow:visible; }

/* 第二~四幕：街景退场 */
.stage.faraway .lamp,
.stage.faraway .tree{ opacity:0; }
.stage.faraway .ground{ opacity:.55; }

/* ---------- 画布 ---------- */
canvas.fx{
  position:absolute; inset:0; width:100%; height:100%;
  pointer-events:none;
  z-index:3;
  transition:opacity 2.2s ease;
}
canvas.fx.gone{ opacity:0; }
#rainC{ z-index:4; opacity:0; transition:opacity 1.8s ease; }
#rainC.on{ opacity:1; }
#trailC{ z-index:6; }
#textC{ z-index:7; }

/* ---------- 光效层 ---------- */
#fx{ position:absolute; inset:0; z-index:8; pointer-events:none; overflow:hidden; }
.dust{
  position:absolute; border-radius:50%;
  background:var(--c,#fff);
  box-shadow:0 0 calc(var(--u) * 1.6) var(--c,#fff);
  will-change:transform, opacity;
}
.ring{
  position:absolute; border-radius:50%;
  border:calc(var(--u) * .22) solid var(--c,#ffd98e);
  box-shadow:0 0 calc(var(--u) * 2.4) var(--c,#ffd98e), inset 0 0 calc(var(--u) * 1.6) var(--c,#ffd98e);
  transform:translate(-50%,-50%) scale(.12);
  opacity:0;
}
.ring.go{ animation:ringGo var(--d,1.2s) cubic-bezier(.16,.7,.28,1) forwards; }
@keyframes ringGo{
  0%{ opacity:.95; transform:translate(-50%,-50%) scale(.12); }
  70%{ opacity:.28; }
  100%{ opacity:0; transform:translate(-50%,-50%) scale(1); }
}
.shock{
  position:absolute; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.95) 0%, var(--c,#fff) 26%, rgba(255,255,255,0) 72%);
  transform:translate(-50%,-50%) scale(.05);
  animation:shockGo var(--d,.9s) cubic-bezier(.1,.7,.2,1) forwards;
  mix-blend-mode:screen;
}
@keyframes shockGo{
  0%{ opacity:1; transform:translate(-50%,-50%) scale(.05); }
  100%{ opacity:0; transform:translate(-50%,-50%) scale(1); }
}

/* ---------- 场景文字 ---------- */
.act{
  position:absolute; inset:0; pointer-events:none;
  opacity:0; transition:opacity 1.15s ease;
  z-index:9;
}
.act.on{ opacity:1; }

.line{
  position:absolute; left:50%; transform:translateX(-50%);
  width:calc(var(--u) * 96);
  text-align:center;
  color:var(--ink);
  text-shadow:0 0 calc(var(--u) * 2.2) rgba(232,240,255,.55),
              0 0 calc(var(--u) * 6) rgba(190,214,255,.22);
  margin:0;
}
.line .ch{ display:inline-block; will-change:transform, opacity, filter; }

/* 第一幕 */
.sub1{
  top:41%; font-size:calc(var(--u) * 4.5);
  letter-spacing:.18em; text-indent:.18em; white-space:nowrap;
}
.sub1 .ch{ opacity:0; transform:translateY(calc(var(--u) * 1.2)); }
.sub1 .ch.in{ animation:charFloat .9s cubic-bezier(.2,.7,.3,1) forwards; }
@keyframes charFloat{
  from{ opacity:0; transform:translateY(calc(var(--u) * 1.4)); filter:blur(calc(var(--u) * .5)); }
  to  { opacity:1; transform:translateY(0); filter:blur(0); }
}

/* 霓虹路牌 */
.neon{
  position:absolute; right:8%; top:22%;
  padding:calc(var(--u) * 2.2) calc(var(--u) * 1.6);
  display:flex; flex-direction:column; align-items:center; gap:calc(var(--u) * .5);
  border:1px solid rgba(190,230,255,.22);
  border-radius:calc(var(--u) * .8);
  transform:rotate(-6.5deg);
  box-shadow:0 0 calc(var(--u) * 3) rgba(150,215,255,.10);
  background:linear-gradient(180deg, rgba(8,12,26,.55), rgba(8,12,26,.25));
  opacity:0;
  transition:opacity .8s ease;
}
.neon.on{ opacity:1; }
.neon b{
  font-weight:400;
  font-size:calc(var(--u) * 4.2);
  line-height:1.18;
  color:#dff2ff;
  opacity:.12;
  text-shadow:0 0 calc(var(--u) * .6) rgba(190,230,255,.4);
  transition:opacity .12s linear, color .12s linear, text-shadow .18s ease;
}
.neon b.lit{
  opacity:1;
  color:#eaf9ff;
  text-shadow:
    0 0 calc(var(--u) * .5) #ffffff,
    0 0 calc(var(--u) * 1.8) rgba(150,225,255,.95),
    0 0 calc(var(--u) * 4.2) rgba(90,190,255,.6),
    0 0 calc(var(--u) * 8) rgba(70,160,255,.28);
}

/* 第二幕 */
.line2a{ top:41%; font-size:calc(var(--u) * 5.5); letter-spacing:.1em; text-indent:.1em; white-space:nowrap;
  text-shadow:0 0 calc(var(--u) * 2.6) rgba(3,6,14,.92), 0 0 calc(var(--u) * 7) rgba(3,6,14,.72), 0 0 calc(var(--u) * 1.2) rgba(255,232,190,.32); }
.line2a .ch{ opacity:0; filter:blur(calc(var(--u) * 1.6)); }
.line2a .ch.in{ animation:dustIn 1.5s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes dustIn{
  0%  { opacity:0; filter:blur(calc(var(--u) * 1.8)); transform:translateX(var(--dx,0)) scale(1.35); }
  60% { opacity:1; filter:blur(calc(var(--u) * .18)); }
  100%{ opacity:1; filter:blur(0); transform:translateX(0) scale(1); }
}
.line2b{
  top:52.5%; font-size:calc(var(--u) * 3.5); letter-spacing:.34em; text-indent:.34em;
  color:#ffe9c2; white-space:nowrap;
  text-shadow:0 0 calc(var(--u) * 2.2) rgba(3,6,14,.9), 0 0 calc(var(--u) * 6) rgba(3,6,14,.66), 0 0 calc(var(--u) * 2.4) rgba(255,217,142,.42);
  opacity:0; transition:opacity 1.6s ease;
}
.line2b.on{ opacity:.92; }

/* 第三幕 */
.line3a{
  top:38%; font-size:calc(var(--u) * 6);
  letter-spacing:.12em; text-indent:.12em; white-space:nowrap;
  opacity:0; transition:opacity .9s ease;
}
.line3a.on{ opacity:1; }
.line3a.glitch{ animation:glitchTxt .28s steps(2,end) infinite; }
@keyframes glitchTxt{
  0%{ transform:translateX(-50%) translate(0,0); text-shadow:0 0 calc(var(--u)*2) rgba(207,232,255,.6); }
  25%{ transform:translateX(-50%) translate(calc(var(--u)*-.7), calc(var(--u)*.2)); text-shadow:
        calc(var(--u)*.5) 0 rgba(255,80,120,.55), calc(var(--u)*-.5) 0 rgba(80,220,255,.55); }
  50%{ transform:translateX(-50%) translate(calc(var(--u)*.5), 0); clip-path:inset(18% 0 42% 0); }
  75%{ transform:translateX(-50%) translate(calc(var(--u)*-.3), calc(var(--u)*-.2)); clip-path:inset(52% 0 12% 0); }
  100%{ transform:translateX(-50%) translate(0,0); clip-path:none; }
}
.line3b{
  top:49%; font-size:calc(var(--u) * 3.4); letter-spacing:.1em;
  color:#cfd8ea; white-space:nowrap; opacity:.9;
  text-shadow:0 0 calc(var(--u) * 2) rgba(180,200,235,.35);
}

/* 第四幕 */
.line4a{
  top:21%; font-size:calc(var(--u) * 6.2); letter-spacing:.14em; text-indent:.14em;
  color:var(--jt); white-space:nowrap;
  text-shadow:0 0 calc(var(--u) * 1.6) rgba(207,232,255,.85),
              0 0 calc(var(--u) * 6) rgba(160,200,255,.4);
  opacity:0;
}
.line4b{
  top:30.5%; font-size:calc(var(--u) * 6.2); letter-spacing:.14em; text-indent:.14em;
  color:var(--sw); white-space:nowrap;
  text-shadow:0 0 calc(var(--u) * 1.6) rgba(255,217,142,.85),
              0 0 calc(var(--u) * 6) rgba(255,180,90,.35);
  opacity:0;
}
.line4a.on,.line4b.on{ animation:breathIn 2.2s ease forwards; }
@keyframes breathIn{
  0%{ opacity:0; letter-spacing:.5em; }
  40%{ opacity:1; }
  100%{ opacity:1; letter-spacing:.14em; }
}
.line4a .ch,.line4b .ch{ opacity:.3; transition:opacity .8s ease; }
.line4a .ch.lit,.line4b .ch.lit{ opacity:1; }

/* 第六幕 */
.line6{
  top:21%; font-size:calc(var(--u) * 5); line-height:1.85;
  letter-spacing:.14em; text-indent:.14em;
  color:#fff6e2; white-space:nowrap;
  text-shadow:0 0 calc(var(--u) * 2) rgba(255,244,220,.8),
              0 0 calc(var(--u) * 5.5) rgba(255,214,150,.42),
              0 0 calc(var(--u) * 12) rgba(255,190,110,.2);
  opacity:0;
  transition:opacity 3s ease, filter 3s ease;
  filter:blur(calc(var(--u) * .5));
}
.line6.on{ opacity:1; filter:blur(0); animation:verseGlow 6s ease-in-out infinite; }
@keyframes verseGlow{
  0%,100%{ text-shadow:0 0 calc(var(--u)*2) rgba(255,244,220,.8),
                       0 0 calc(var(--u)*5.5) rgba(255,214,150,.42),
                       0 0 calc(var(--u)*12) rgba(255,190,110,.2); }
  50%    { text-shadow:0 0 calc(var(--u)*2.6) rgba(255,246,228,.95),
                       0 0 calc(var(--u)*7.5) rgba(255,220,160,.55),
                       0 0 calc(var(--u)*16) rgba(255,196,120,.3); }
}

/* ---------- 气泡 ---------- */
#bubbles{ position:absolute; inset:0; z-index:12; pointer-events:none; }
.bubble{
  position:absolute;
  padding:calc(var(--u) * 2.1) calc(var(--u) * 3);
  border-radius:calc(var(--u) * 2.6);
  border:1px solid var(--c);
  background:rgba(9,14,30,.9);
  color:#f6faff;
  font-size:calc(var(--u) * 3.9);
  line-height:1.2;
  white-space:nowrap;
  box-shadow:0 0 calc(var(--u) * 2.6) rgba(180,210,255,.28),
             0 0 calc(var(--u) * 8) rgba(120,180,255,.12);
  transform:translate(-50%,-100%) scale(.4);
  transform-origin:50% 120%;
  opacity:0;
  transition:transform .62s cubic-bezier(.18,1.5,.42,1), opacity .3s ease;
}
.bubble.on{ transform:translate(-50%,-100%) scale(1); opacity:1; }
.bubble::after{
  content:''; position:absolute; bottom:calc(var(--u) * -1.05); left:var(--tail, 50%);
  width:calc(var(--u) * 1.5); height:calc(var(--u) * 1.5);
  margin-left:calc(var(--u) * -.75);
  background:inherit; border-right:1px solid var(--c); border-bottom:1px solid var(--c);
  transform:rotate(45deg); border-radius:0 0 calc(var(--u) * .3) 0;
}
.bubble.shake{ animation:bubbleShake .6s ease-in-out 1; }
@keyframes bubbleShake{
  0%,100%{ margin-left:0; }
  15%{ margin-left:calc(var(--u) * -1.1); }
  35%{ margin-left:calc(var(--u) * 1); }
  55%{ margin-left:calc(var(--u) * -.7); }
  75%{ margin-left:calc(var(--u) * .4); }
}

/* ---------- Q 版双人 ---------- */
#actors{ position:absolute; inset:0; z-index:10; pointer-events:none; }
.chibi{
  position:absolute; left:50%; bottom:14.5%;
  width:calc(var(--u) * 54);
  transform:translate(-50%, calc(var(--u) * 9)) scale(.9);
  opacity:0;
  filter:drop-shadow(0 0 calc(var(--u) * 3) rgba(255,214,150,.28));
  will-change:transform, opacity;
}
.chibi img{ width:100%; height:auto; display:block; position:relative; z-index:1; filter:saturate(1.04) contrast(1.07) brightness(.97); }
.chibi::before{
  content:''; position:absolute; left:6%; right:6%; bottom:-1%; height:5.5%;
  border-radius:50%; z-index:0;
  background:radial-gradient(ellipse at 50% 50%, rgba(2,4,10,.72) 0%, rgba(2,4,10,.38) 42%, transparent 74%);
  filter:blur(calc(var(--u) * 1.1));
}
.chibi.rise{ animation:chibiRise 1.35s cubic-bezier(.18,1.25,.35,1) forwards; }
@keyframes chibiRise{
  from{ opacity:0; transform:translate(-50%, calc(var(--u) * 9)) scale(.9); }
  to  { opacity:1; transform:translate(-50%, 0) scale(1); }
}
.chibi.settle{ opacity:1; animation:chibiSway 3.2s ease-in-out .2s 2 forwards; }
@keyframes chibiSway{
  0%,100%{ transform:translate(-50%,0) rotate(0deg); }
  30%    { transform:translate(-50%,calc(var(--u) * -.35)) rotate(-1.1deg); }
  65%    { transform:translate(-50%,0) rotate(.9deg); }
}
.anchor{ position:absolute; width:1px; height:1px; }

/* 睡衣彩蛋 */
.pajama{
  position:absolute; right:1.5%; bottom:8.5%;
  width:calc(var(--u) * 21);
  opacity:0; transform:translate(calc(var(--u) * 12), calc(var(--u) * 6)) rotate(4deg);
  transition:transform 1.1s cubic-bezier(.2,.9,.3,1), opacity 1.1s ease;
  filter:drop-shadow(0 0 calc(var(--u) * 2) rgba(255,214,150,.2));
}
.pajama.on{ opacity:1; transform:translate(0,0) rotate(0deg); }
.pajama img{ width:100%; height:auto; display:block; filter:saturate(1.04) contrast(1.07) brightness(.97); }
.pajama .zz{

<script>
window.__err = []; window.addEventListener("error", e => window.__err.push(String(e.message||e)));window.addEventListener("unhandledrejection", e => window.__err.push(String(e.reason)));

'use strict';
/* ============================================================
   0 · 基础工具
   ============================================================ */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInOutCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

let stageEl = null;
/** 1u = 舞台宽度的 1%，所有坐标都以 u 为单位（原点左上，y 向下） */
function U(){ return (stageEl ? stageEl.clientWidth : 400) / 100; }

/** 让 canvas 铺满舞台，并把绘图坐标系换算成 u */
function fitCanvas(c){
  if(!c) return null;
  const u = U();
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = Math.round(w * dpr);
  c.height = Math.round(h * dpr);
  const ctx = c.getContext('2d');
  ctx.setTransform(dpr * u, 0, 0, dpr * u, 0, 0);
  return ctx;
}
function clearCanvas(c){
  if(!c) return;
  const ctx = c.getContext('2d');
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.restore();
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

/** 把一行字拆成 span */
function splitChars(el, text){
  el.textContent = '';
  const out = [];
  for(const ch of Array.from(text)){
    const s = document.createElement('span');
    s.className = 'ch';
    s.textContent = ch;
    el.appendChild(s);
    out.push(s);
  }
  return out;
}

/** 逐字浮现（float = 上浮 / dust = 光尘旋入） */
function fadeChars(el, text, { charMs = 90, mode = 'float', dx = 26 } = {}){
  const spans = splitChars(el, text);
  spans.forEach((s, i) => {
    if(mode === 'dust') s.style.setProperty('--dx', ((i % 2 ? 1 : -1) * dx * rand(.7, 1.3)) + 'px');
    setTimeout(() => s.classList.add('in'), i * charMs);
  });
  return new Promise(res => setTimeout(res, spans.length * charMs + 1600));
}

/* ---------- 星星 ---------- */
function buildStars(){
  const box = $('stars');
  if(!box) return;
  let html = '';
  for(let i = 0; i < 64; i++){
    const x = rand(0, 100).toFixed(2), y = rand(0, 60).toFixed(2);
    const s = rand(.7, 2.2).toFixed(2), o = rand(.18, .8).toFixed(2);
    html += '<i style="left:' + x + '%;top:' + y + '%;width:' + s + 'px;height:' + s +
            'px;--o:' + o + ';animation-duration:' + rand(3.2, 8).toFixed(2) +
            's;animation-delay:' + (-rand(0, 8)).toFixed(2) + 's"></i>';
  }
  box.innerHTML = html;
}

/* ============================================================
   1 · 统一的 rAF 调度（避免多个循环抢帧）
   ============================================================ */
const Ticker = {
  fns: new Set(),
  last: 0,
  running: false,
  add(fn){ this.fns.add(fn); this.start(); },
  remove(fn){ this.fns.delete(fn); },
  start(){
    if(this.running) return;
    this.running = true;
    this.last = performance.now();
    const loop = (t) => {
      const dt = Math.min(48, t - this.last);
      this.last = t;
      for(const fn of this.fns){ try{ fn(dt, t); }catch(e){ /* 静默 */ } }
      if(this.fns.size) requestAnimationFrame(loop);
      else this.running = false;
    };
    requestAnimationFrame(loop);
  }
};

/** 一片柔边雪花的贴图（64×64） */
let SNOW_SPRITE = null;
function snowSprite(){
  if(SNOW_SPRITE) return SNOW_SPRITE;
  const s = 64, c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(.42, 'rgba(236,246,255,.62)');
  grd.addColorStop(.72, 'rgba(214,232,255,.22)');
  grd.addColorStop(1, 'rgba(200,220,255,0)');
  g.fillStyle = grd;
  g.beginPath(); g.arc(s / 2, s / 2, s / 2, 0, Math.PI * 2); g.fill();
  SNOW_SPRITE = c;
  return c;
}

/* ============================================================
   2 · createSnow —— 三层视差雪
   默认 {layers:3, counts:[60,40,20], wind:0.3, drift:true}
   ============================================================ */
function createSnow(canvas, opts = {}){
  const cfg = Object.assign({ layers: 3, counts: [60, 40, 20], wind: .3, drift: true }, opts || {});
  const layers = Math.max(1, cfg.layers | 0);
  const baseCounts = (Array.isArray(cfg.counts) && cfg.counts.length ? cfg.counts : [60, 40, 20]).slice(0, layers);
  while(baseCounts.length < layers) baseCounts.push(20);

  let ctx = fitCanvas(canvas);
  let SP = snowSprite();
  let flakes = [];
  let running = false, density = 1, px = 0, py = 0, speedBoost = 1;
  const rand = (a, b) => a + Math.random() * (b - a);

  function makeFlake(layer){
    const near = layer / Math.max(1, layers - 1);          // 0 = 远，1 = 近
    const r = (0.22 + near * 0.52) * rand(.62, 1.5);
    return {
      layer, r,
      x: rand(-4, 104),
      y: rand(-8, 182),
      vy: (2.0 + near * 5.2) * rand(.7, 1.35),
      amp: cfg.drift ? rand(.4, 2.4) * (0.4 + near) : 0,
      ph: rand(0, Math.PI * 2),
      sw: rand(.4, 1.35),
      a: rand(.28, .92) * (0.45 + near * .55),
      wob: rand(.5, 1.6)
    };
  }
  function rebuild(){
    flakes = [];
    const f = density;
    baseCounts.forEach((n, li) => {
      const cnt = Math.round(n * f);
      for(let i = 0; i < cnt; i++) flakes.push(makeFlake(li));
    });
  }
  rebuild();

  let t0 = 0;
  function frame(dt){
    if(!ctx) return;
    t0 += dt;
    const u = U();
    const H = stageEl.clientHeight / u;
    ctx.clearRect(0, 0, 100, H);
    const img = SP;
    for(const f of flakes){
      const par = (f.layer + 1) / layers;                 // 远小近大
      f.y += f.vy * speedBoost * dt / 1000 * 6;
      f.x += (cfg.wind * (2 + f.layer * 2.4)) * dt / 1000 * 6;
      if(f.y > H + 6){ f.y = -6; f.x = rand(-4, 104); }
      if(f.x > 106) f.x -= 112;
      if(f.x < -6) f.x += 112;
      const wob = cfg.drift ? Math.sin(t0 / 1000 * f.sw + f.ph) * f.amp : 0;
      const dx = (f.x + wob + px * par * 0.9);
      const dy = (f.y + py * par * 0.9);
      const d = f.r * 2.6;
      ctx.globalAlpha = f.a;
      ctx.drawImage(img, dx - d / 2, dy - d / 2, d, d);
    }
    ctx.globalAlpha = 1;
  }

  return {
    start(){ if(running) return; running = true; Ticker.add(frame); },
    stop(){ if(!running) return; running = false; Ticker.remove(frame); },
    /** n ≤ 5 视为密度系数；n > 5 视为总片数 */
    setDensity(n){
      n = Math.max(0, Number(n) || 0);
      if(n > 5){
        const total = baseCounts.reduce((a, b) => a + b, 0) || 1;
        density = n / total;
      } else density = n;
      rebuild();
    },
    setParallax(dx, dy){ px = dx || 0; py = dy || 0; },
    /** 内部：让雪整体加速（第一幕结尾"向上飞散"用） */
    setSpeed(v){ speedBoost = v || 1; },
    resize(){ ctx = fitCanvas(canvas); SP = snowSprite(); },
    destroy(){ this.stop(); flakes = []; clearCanvas(canvas); }
  };
}

/* ============================================================
   3 · createLeaves —— 金色梧桐叶
   默认 {count:45, colors:['#e8c86a','#c9d67a','#a8b86a']}
   ============================================================ */
function createLeaves(canvas, opts = {}){
  const cfg = Object.assign({
    count: 45,
    colors: ['#e8c86a', '#c9d67a', '#a8b86a']
  }, opts || {});
  const colors = (cfg.colors && cfg.colors.length) ? cfg.colors : ['#e8c86a'];
  let ctx = fitCanvas(canvas);
  let leaves = [];
  let running = false, density = 1, px = 0, py = 0, t = 0;

  function makeLeaf(){
    return {
      x: rand(-6, 106), y: rand(-14, 176),
      s: rand(1.1, 2.5),
      vy: rand(3.2, 8.4),
      vx: rand(-1.4, 2.2),
      rot: rand(0, Math.PI * 2),
      vr: rand(-1.6, 1.6),
      sway: rand(.7, 2.1),
      ph: rand(0, Math.PI * 2),
      a: rand(.55, .95),
      c: colors[(Math.random() * colors.length) | 0]
    };
  }
  function rebuild(){
    const n = Math.round(cfg.count * density);
    leaves = [];
    for(let i = 0; i < n; i++) leaves.push(makeLeaf());
  }
  rebuild();

  function leafPath(g, s){
    g.beginPath();
    g.moveTo(0, -s);
    g.bezierCurveTo(s * .92, -s * .58, s * .82, s * .58, 0, s);
    g.bezierCurveTo(-s * .82, s * .58, -s * .92, -s * .58, 0, -s);
    g.closePath();
  }

  function frame(dt){
    if(!ctx) return;
    t += dt;
    const u = U(), H = stageEl.clientHeight / u;
    ctx.clearRect(0, 0, 100, H);
    for(const l of leaves){
      l.y += l.vy * dt / 1000 * 6;
      l.x += (l.vx + Math.sin(t / 1000 * l.sway + l.ph) * 1.6) * dt / 1000 * 6;
      l.rot += l.vr * dt / 1000;
      if(l.y > H + 8){ l.y = -8; l.x = rand(-6, 106); }
      if(l.x > 108) l.x = -8;
      if(l.x < -8) l.x = 108;
      ctx.save();
      ctx.translate((l.x + px * .6), (l.y + py * .6));
      ctx.rotate(l.rot);
      ctx.globalAlpha = l.a;
      const s = l.s;
      leafPath(ctx, s);
      const g = ctx.createLinearGradient(0, -s, 0, s);
      g.addColorStop(0, l.c);
      g.addColorStop(1, 'rgba(140,110,50,.55)');
      ctx.fillStyle = g;
      ctx.shadowColor = 'rgba(255,214,140,.5)';
      ctx.shadowBlur = s * .9;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = l.a * .5;
      ctx.strokeStyle = 'rgba(255,240,200,.6)';
      ctx.lineWidth = Math.max(.15, s * .08);
      ctx.beginPath(); ctx.moveTo(0, -s * .8); ctx.lineTo(0, s * .8); ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  return {
    start(){ if(running) return; running = true; Ticker.add(frame); },
    stop(){ if(!running) return; running = false; Ticker.remove(frame); },
    setDensity(n){
      n = Math.max(0, Number(n) || 0);
      density = n > 5 ? n / (cfg.count || 45) : n;
      rebuild();
    },
    setParallax(dx, dy){ px = dx || 0; py = dy || 0; },
    resize(){ ctx = fitCanvas(canvas); },
    destroy(){ this.stop(); leaves = []; clearCanvas(canvas); }
  };
}

/* ============================================================
   4 · 雨（第三幕）与浮尘（保证任何时刻画面都在动）
   ============================================================ */
function createRain(canvas){
  let ctx = fitCanvas(canvas);
  let drops = [], running = false, intensity = 0, t = 0;
  function build(){
    const n = Math.round(150 * intensity);
    drops = [];
    for(let i = 0; i < n; i++){
      drops.push({ x: rand(-10, 110), y: rand(-30, 180), len: rand(2.4, 6.2), v: rand(26, 52), a: rand(.12, .38) });
    }
  }
  function frame(dt){
    if(!ctx) return;
    t += dt;
    const u = U(), H = stageEl.clientHeight / u;
    ctx.clearRect(0, 0, 100, H);
    if(!intensity) return;
    ctx.lineCap = 'round';
    for(const d of drops){
      d.y += d.v * dt / 1000 * 6;
      d.x -= d.v * dt / 1000 * 1.35;
      if(d.y > H + 10){ d.y = rand(-24, -4); d.x = rand(-10, 112); }
      ctx.strokeStyle = 'rgba(186,214,255,' + d.a + ')';
      ctx.lineWidth = .16;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo((d.x - d.len * .34), (d.y - d.len));
      ctx.stroke();
    }
  }
  return {
    setIntensity(v){ intensity = clamp(v, 0, 1); build(); },
    start(){ if(running) return; running = true; Ticker.add(frame); },
    stop(){ running = false; Ticker.remove(frame); clearCanvas(canvas); },
    resize(){ ctx = fitCanvas(canvas); }
  };
}

function createMotes(canvas){
  let ctx = fitCanvas(canvas);
  let arr = [], running = false, t = 0, on = false;
  function build(){
    arr = [];
    for(let i = 0; i < 34; i++){
      arr.push({ x: rand(0, 100), y: rand(0, 178), r: rand(.12, .42), v: rand(1.1, 3.4), ph: rand(0, 6.28), a: rand(.12, .5) });
    }
  }
  build();
  function frame(dt){
    if(!ctx || !on) return;
    t += dt;
    const u = U(), H = stageEl.clientHeight / u;
    ctx.clearRect(0, 0, 100, H);
    for(const m of arr){
      m.y -= m.v * dt / 1000 * 3;
      if(m.y < -4){ m.y = H + 4; m.x = rand(0, 100); }
      const x = m.x + Math.sin(t / 1000 * .5 + m.ph) * 1.6;
      ctx.globalAlpha = m.a * (.6 + .4 * Math.sin(t / 900 + m.ph));
      ctx.fillStyle = '#e9f2ff';
      ctx.beginPath();
      ctx.arc(x, m.y, Math.max(.06, m.r), 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  return {
    start(){ if(running) return; running = true; on = true; Ticker.add(frame); },
    stop(){ running = false; on = false; Ticker.remove(frame); clearCanvas(canvas); },
    resize(){ ctx = fitCanvas(canvas); }
  };
}

/* ============================================================
   5 · 光粒子汇聚成字
   convergeText(canvas, text, {x, y, size, color, durationMs}) → Promise
   坐标单位 u，x/y 为文字中心
   ============================================================ */
function convergeText(canvas, text, opt = {}){
  const o = Object.assign({ x: 50, y: 36, size: 14, color: '#e8ecf8', durationMs: 2600 }, opt || {});
  const u = U();
  const ctx = canvas.getContext('2d');
  const W = 100, H = stageEl.clientHeight / u;

  return new Promise(resolve => {
    /* 1. 先画一遍，拿到字形像素采样点 */
    ctx.save();
    ctx.setTransform(Math.min(2, devicePixelRatio || 1) * u, 0, 0, Math.min(2, devicePixelRatio || 1) * u, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.font = o.size + 'px "STKaiti","KaiTi","Kaiti SC",serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(text, o.x, o.y);
    const m = ctx.measureText(text);
    const halfW = Math.min(m.width / 2 + 2, 49);
    const halfH = o.size * 0.85;
    const dpr = Math.min(2, devicePixelRatio || 1);
    const sx = Math.max(0, (o.x - halfW) * u * dpr);
    const sy = Math.max(0, (o.y - halfH) * u * dpr);
    const sw = Math.min(canvas.width - sx, halfW * 2 * u * dpr);
    const sh = Math.min(canvas.height - sy, halfH * 2 * u * dpr);
    ctx.restore();

    let targets = [];
    try{
      const img = ctx.getImageData(sx | 0, sy | 0, Math.max(1, sw | 0), Math.max(1, sh | 0));
      const d = img.data;
      const step = Math.max(2, Math.round(2.2 * dpr));
      for(let yy = 0; yy < img.height; yy += step){
        for(let xx = 0; xx < img.width; xx += step){
          if(d[(yy * img.width + xx) * 4 + 3] > 140){
            targets.push({
              x: (sx + xx) / (dpr * u),
              y: (sy + yy) / (dpr * u)
            });
          }
        }
      }
    }catch(e){ targets = []; }

    clearCanvas(canvas);
    if(!targets.length){
      drawFinish();
      resolve();
      return;
    }

    /* 2. 随机挑一批粒子，从远处飞来 */
    const MAX = 240;
    const picks = [];
    const stride = Math.max(1, Math.floor(targets.length / MAX));
    for(let i = 0; i < targets.length; i += stride) picks.push(targets[i]);

    const parts = picks.map((t, i) => {
      const ang = rand(0, Math.PI * 2), rr = rand(26, 62);
      return {
        tx: t.x, ty: t.y,
        sx: clamp(o.x + Math.cos(ang) * rr, -10, 110),
        sy: clamp(o.y + Math.sin(ang) * rr * .8, -10, H + 10),
        delay: (i / picks.length) * o.durationMs * .55,
        dur: o.durationMs * rand(.42, .62),
        r: rand(.1, .26)
      };
    });

    const start = performance.now();
    let done = false;

    function frame(dt, now){
      const el = now - start;
      const dpr = Math.min(2, devicePixelRatio || 1);
      ctx.setTransform(dpr * u, 0, 0, dpr * u, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';
      for(const p of parts){
        const k = clamp((el - p.delay) / p.dur, 0, 1);
        if(k <= 0) continue;
        const e = easeOutCubic(k);
        const x = p.sx + (p.tx - p.sx) * e;
        const y = p.sy + (p.ty - p.sy) * e;
        const a = k < .85 ? (0.25 + .75 * k) : (1 - (k - .85) / .15 * .25);
        ctx.globalAlpha = a;
        ctx.fillStyle = o.color;
        ctx.shadowColor = o.color;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(x, y, p.r * (1.6 - .6 * e), 0, 6.2832);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';

      if(el > o.durationMs + 200 && !done){
        done = true;
        drawFinish();
        Ticker.remove(frame);
        resolve();
      }
    }

    function drawFinish(){
      const dpr = Math.min(2, devicePixelRatio || 1);
      ctx.setTransform(dpr * u, 0, 0, dpr * u, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ctx.font = o.size + 'px "STKaiti","KaiTi","Kaiti SC",serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.globalCompositeOperation = 'lighter';
      ctx.shadowColor = o.color;
      ctx.shadowBlur = 22;
      ctx.globalAlpha = .55;
      ctx.fillStyle = o.color;
      ctx.fillText(text, o.x, o.y);
      ctx.shadowBlur = 8;
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#f4f8ff';
      ctx.fillText(text, o.x, o.y);
      ctx.shadowBlur = 0;
      ctx.globalCompositeOperation = 'source-over';
    }

    Ticker.add(frame);
  });
}

/* ============================================================
   6 · 霓虹逐字点亮
   ============================================================ */
function neonFlicker(el, opt = {}){
  const o = Object.assign({ charDelayMs: 260 }, opt || {});
  const chars = Array.from(el.querySelectorAll('b'));
  el.classList.add('on');
  return new Promise(resolve => {
    chars.forEach((b, i) => {
      setTimeout(() => {
        let n = 0;
        const blink = () => {
          b.classList.toggle('lit');
          if(++n < 5) setTimeout(blink, rand(40, 110));
          else b.classList.add('lit');
        };
        blink();
      }, i * o.charDelayMs);
    });
    setTimeout(resolve, (chars.length - 1) * o.charDelayMs + 620);
  });
}

/* ============================================================
   7 · lightTrails —— 贝塞尔光点 + 拖尾
   fromXY / toXY：{x, y}（单位 u）
   ============================================================ */
const TrailMan = {
  items: [],
  ctx: null,
  canvas: null,
  on: false,
  init(canvas){
    this.canvas = canvas;
    this.ctx = fitCanvas(canvas);
  },
  resize(){
    if(this.canvas) this.ctx = fitCanvas(this.canvas);
  },
  tick(){
    if(!this.ctx) return;
    const u = U(), H = stageEl.clientHeight / u;
    const ctx = this.ctx;
    const dpr = Math.min(2, devicePixelRatio || 1);
    ctx.setTransform(dpr * u, 0, 0, dpr * u, 0, 0);
    ctx.clearRect(0, 0, 100, H);
    if(!this.items.length){ this.on = false; Ticker.remove(this._f); return; }
    ctx.globalCompositeOperation = 'lighter';
    for(const it of this.items){
      const k = clamp((performance.now() - it.start) / it.dur, 0, 1);
      const e = it.ease(k);
      const mt = 1 - e;
      const x = mt * mt * it.a.x + 2 * mt * e * it.c.x + e * e * it.b.x;
      const y = mt * mt * it.a.y + 2 * mt * e * it.c.y + e * e * it.b.y;
      const last = it.pos[it.pos.length - 1];
      if(!last || Math.hypot(x - last.x, y - last.y) > .6){
        it.pos.push({ x, y });
        if(it.pos.length > 30) it.pos.shift();
      }
      /* 拖尾 */
      for(let i = 0; i < it.pos.length; i++){
        const p = it.pos[i];
        const q = i / it.pos.length;
        const a = q * q * (it.fadeTail === false ? 1 : .9);
        const r = (0.16 + q * 0.86) * it.size;
        ctx.globalAlpha = a * .9;
        ctx.fillStyle = it.color;
        ctx.shadowColor = it.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, 6.2832);
        ctx.fill();
      }
      /* 头部 */
      ctx.globalAlpha = 1;
      const g = ctx.createRadialGradient(x, y, 0, x, y, 3.1 * it.size);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(.26, it.color);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, 3.1 * it.size, 0, 6.2832);
      ctx.fill();
      if(k >= 1 && !it.done){
        it.done = true;
        it.resolve({ x, y });
      }
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';
    this.items = this.items.filter(i => !i.done || (performance.now() - i.start) < i.dur + 260);
    if(!this.items.length){
      this.on = false;
      Ticker.remove(this._f);
      ctx.clearRect(0, 0, 100, H);
    }
  }
};

function lightTrails(canvas, fromXY, toXY, color, opt = {}){
  if(!TrailMan.ctx) TrailMan.init(canvas);
  const o = Object.assign({ durationMs: 5000, curve: .35, fadeTail: true }, opt || {});
  const a = { x: fromXY.x, y: fromXY.y };
  const b = { x: toXY.x, y: toXY.y };
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const c = {
    x: (a.x + b.x) / 2 + nx * len * o.curve,
    y: (a.y + b.y) / 2 + ny * len * o.curve
  };
  return new Promise(resolve => {
    const item = {
      a, b, c, color, pos: [],
      start: performance.now(),
      dur: o.durationMs,
      ease: easeInOutCubic,
      size: .85, fadeTail: o.fadeTail,
      done: false, resolve
    };
    TrailMan.items.push(item);
    if(!TrailMan.on){
      TrailMan.on = true;
      TrailMan._f = () => TrailMan.tick();
      Ticker.add(TrailMan._f);
    }
  });
}

/* ============================================================
   8 · glitchText —— 故障抖动三次
   ============================================================ */
function glitchText(el, text, opt = {}){
  const o = Object.assign({ jitterMs: 300 }, opt || {});
  el.textContent = text;
  el.classList.add('on');
  return new Promise(resolve => {
    let n = 0;
    const burst = () => {
      el.classList.add('glitch');
      setTimeout(() => {
        el.classList.remove('glitch');
        n++;
        if(n < 3) setTimeout(burst, 190);
        else setTimeout(resolve, 260);
      }, o.jitterMs);
    };
    burst();
  });
}

/* ============================================================
   9 · popBubble —— 从头顶弹出气泡
   ============================================================ */
function popBubble(anchorEl, text, opt = {}){
  const o = Object.assign({ side: 'left', color: '#cfe8ff' }, opt || {});
  return new Promise(resolve => {
    const host = $('bubbles');
    const sr = stageEl.getBoundingClientRect();
    const ar = (anchorEl || stageEl).getBoundingClientRect();
    const bx = document.createElement('div');
    bx.className = 'bubble';
    bx.textContent = text;
    bx.style.setProperty('--c', o.color);
    bx.style.color = o.color === '#ffd98e' ? '#ffe9c2' : '#eaf6ff';
    bx.style.borderColor = o.color;
    host.appendChild(bx);

    const w = bx.offsetWidth || 120;
    const anchorX = ar.left - sr.left + ar.width / 2;
    const anchorY = ar.top - sr.top;
    let x = anchorX;
    if(o.side === 'right') x = anchorX + w * .22;
    if(o.side === 'left') x = anchorX - w * .22;
    const u = U();
    x = clamp(x, w / 2 + 2 * u, sr.width - w / 2 - 2 * u);

    bx.style.left = x + 'px';
    bx.style.top = (anchorY - 2.2 * u) + 'px';
    /* 尾巴对准锚点 */
    const tailX = clamp(anchorX - (x - w / 2), w * .18, w * .82);

    requestAnimationFrame(() => {
      bx.classList.add('on');
      setTimeout(resolve, 720);
    });
    /* 记录尾巴位置（伪元素只能靠变量） */
    bx.style.setProperty('--tail', tailX + 'px');
  });
}

/* ============================================================
   10 · burstAt —— 星尘 / 雪雾炸开
   ============================================================ */
function burstAt(x, y, opt = {}){
  const o = Object.assign({ count: 16, color: '#e8f2ff', spreadMs: 850 }, opt || {});
  const u = U();
  const host = $('fx');
  if(!host) return;
  for(let i = 0; i < o.count; i++){
    const d = document.createElement('div');
    d.className = 'dust';
    const s = rand(.28, .95) * u;
    d.style.width = d.style.height = s + 'px';
    d.style.setProperty('--c', o.color);
    d.style.left = (x * u) + 'px';
    d.style.top = (y * u) + 'px';
    d.style.marginLeft = d.style.marginTop = (-s / 2) + 'px';
    host.appendChild(d);
    const ang = rand(0, Math.PI * 2);
    const dist = rand(.8, 4.6) * u;
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - u * .6;
    const dur = o.spreadMs * rand(.7, 1.2);
    const anim = d.animate([
      { transform: 'translate(0,0) scale(1)', opacity: 1 },
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.15)', opacity: 0 }
    ], { duration: dur, easing: 'cubic-bezier(.14,.72,.32,1)', delay: rand(0, 90) });
    anim.onfinish = () => d.remove();
  }
}

   ============================================================ */
function heartbeatPulse(x, y, opt = {}){
  const o = Object.assign({ color: '#ffd98e', periodMs: 1200, times: 2 }, opt || {});
  const u = U();
  const host = $('fx');
  if(!host) return Promise.resolve();
  for(let i = 0; i < o.times; i++){
    const r = document.createElement('div');
    r.className = 'ring';
    const size = 46 * u;
    r.style.width = r.style.height = size + 'px';
    r.style.left = (x * u) + 'px';
    r.style.top = (y * u) + 'px';
    r.style.setProperty('--c', o.color);
    r.style.setProperty('--d', (o.periodMs * 1.15) + 'ms');
    r.style.animationDelay = (i * o.periodMs) + 'ms';
    host.appendChild(r);
    requestAnimationFrame(() => r.classList.add('go'));
    setTimeout(() => r.remove(), i * o.periodMs + o.periodMs * 1.4 + 300);
  }
  return Promise.resolve();
}

   ============================================================ */
const Sound = {
  bgm: null,
  baseVol: .35,
  ambientStop: null,
  usingAmbient: false,
  bgmReady: false
};

function fadeVolume(el, to, ms){
  if(!el) return;
  const from = el.volume;
  const t0 = performance.now();
  const step = (t) => {
    const k = clamp((t - t0) / ms, 0, 1);
    try{ el.volume = clamp(from + (to - from) * k, 0, 1); }catch(e){}
    if(k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

let __sharedCtx = null;
function ensureCtx(){
  try{
    if(!__sharedCtx) __sharedCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(__sharedCtx.state === 'suspended'){ try{ __sharedCtx.resume(); }catch(e){} }
    return __sharedCtx;
  }catch(e){ return null; }
}

/** 90 秒配乐（现场合成）：钢琴 + 弦垫 + 低音 + 钟琴，按六幕结构谱写。
 *  没有音频文件时用它兜底；返回 stop()。 */
function fallbackAmbient(){
  const ctx = ensureCtx();
  if(!ctx) return function(){};
  const T0 = ctx.currentTime + .05;

  /* ---- 总线：干声 + 混响 ---- */
  const master = ctx.createGain();
  master.gain.value = 0;
  try{
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -10; comp.knee.value = 12; comp.ratio.value = 4;
    comp.attack.value = .012; comp.release.value = .25;
    master.connect(comp); comp.connect(ctx.destination);
  }catch(e){ master.connect(ctx.destination); }

  const dry = ctx.createGain(); dry.gain.value = .85; dry.connect(master);
  window.__ambCtx = ctx; window.__ambMaster = master;
  const send = ctx.createGain(); send.gain.value = .55; send.connect(master);

  let conv = null;
  try{
    conv = ctx.createConvolver();
    const len = Math.floor(ctx.sampleRate * 3.0);
    const ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for(let c = 0; c < 2; c++){
      const d = ir.getChannelData(c);
      for(let i = 0; i < len; i++){
        const t = i / len;
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.4) * (i < 240 ? i / 240 : 1);
      }
    }
    conv.buffer = ir;
    const wet = ctx.createGain(); wet.gain.value = .42;
    conv.connect(wet); wet.connect(master);
  }catch(e){ conv = null; }

  const bus = (g) => {
    g.connect(dry);
    if(conv){ try{ g.connect(conv); }catch(e){} } else { try{ g.connect(master); }catch(e){} }
  };

  /* ---- 音色 ---- */
  const P = (t, f, dur, vel) => {                 // 钢琴：加法合成 + 指数衰减
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vel, t + .008);
    g.gain.exponentialRampToValueAtTime(.0004, t + dur);
    bus(g);
    [[1, 1], [2, .40], [3, .16], [4.02, .08], [5.01, .04]].forEach(([m, a]) => {
      const o = ctx.createOscillator();
      o.type = 'sine'; o.frequency.value = f * m;
      o.detune.value = (Math.random() * 4 - 2);
      const og = ctx.createGain();
      og.gain.value = a * .5;
      og.gain.setValueAtTime(a * .5, t);
      og.gain.exponentialRampToValueAtTime(.0002, t + dur * (1 - .11 * m));
      o.connect(og); og.connect(g);
      o.start(t); o.stop(t + dur + .4);
    });
  };

  const PAD = (t, freqs, dur, vel) => {           // 弦垫：三个失谐锯齿 + 低通
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 980; lp.Q.value = .35;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vel, t + Math.min(1.6, dur * .5));
    g.gain.setValueAtTime(vel, t + dur * .8);
    g.gain.linearRampToValueAtTime(0, t + dur + 1.6);
    lp.connect(g); bus(g);
    freqs.forEach(f => [-7, 0, 7].forEach(dt => {
      const o = ctx.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = dt;
      const og = ctx.createGain(); og.gain.value = .10 / freqs.length;
      o.connect(og); og.connect(lp);
      o.start(t); o.stop(t + dur + 1.8);
    }));
  };

  const BASS = (t, f, dur, vel) => {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vel, t + .03);
    g.gain.exponentialRampToValueAtTime(.0005, t + dur);
    bus(g);
    [[1, 1], [2, .28]].forEach(([m, a]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * m;
      const og = ctx.createGain(); og.gain.value = a * .6;
      o.connect(og); og.connect(g); o.start(t); o.stop(t + dur + .2);
    });
  };

  const BELL = (t, f, vel) => {                   // 钟琴 / 八音盒
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vel, t + .006);
    g.gain.exponentialRampToValueAtTime(.0003, t + 2.4);
    bus(g);
    [[1, 1], [2.4, .42], [3.9, .22], [5.4, .10]].forEach(([m, a]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * m;
      const og = ctx.createGain(); og.gain.value = a * .45;
      og.gain.setValueAtTime(a * .45, t);
      og.gain.exponentialRampToValueAtTime(.0002, t + 2.2);
      o.connect(og); og.connect(g); o.start(t); o.stop(t + 2.6);
    });
  };

  /* ---- 和声：C – G/B – Am – F，每小节一个，共 24 小节 = 90s ---- */
  const BAR = 3.75;                    // 64 BPM，4/4
  const CH = [
    { pad: [130.81, 196.00, 261.63, 329.63], root: 130.81 },   // C
    { pad: [123.47, 196.00, 246.94, 293.66], root: 123.47 },   // G/B
    { pad: [110.00, 164.81, 220.00, 261.63], root: 110.00 },   // Am
    { pad: [87.31, 130.81, 174.61, 220.00], root: 87.31 }      // F
  ];
  const barT = (i) => T0 + i * BAR;
  const chOf = (i) => CH[i % 4];

  /* 主旋律（4 小节一句）：E4 G4 A4 | G4 D4 | C4 E4 A4 | G4 C5 */
  const MEL = [
    [[0, 329.63, 1.7], [1.5, 392.00, 1.2], [2.5, 440.00, 1.3]],
    [[0, 392.00, 1.5], [1.5, 293.66, 1.6]],
    [[0, 261.63, 1.4], [1.5, 329.63, 1.1], [2.5, 440.00, 1.5]],
    [[0, 392.00, 1.4], [2, 523.25, 1.8]]
  ];
  const MEL_HI = [
    [[0, 659.25, 1.4], [1.5, 783.99, 1.2], [2.5, 880.00, 1.2]],
    [[0, 783.99, 1.3], [1.5, 587.33, 1.4]],
    [[0, 523.25, 1.3], [1.5, 659.25, 1.1], [2.5, 880.00, 1.4]],
    [[0, 783.99, 1.2], [2, 1046.50, 1.6]]
  ];

  const beat = BAR / 4;

  for(let bar = 0; bar < 24; bar++){
    const t = barT(bar), ch = chOf(bar), ph = bar % 4;
    const inAct1 = bar < 4;          // 0–15s   落雪
    const inAct2 = bar >= 4 && bar < 8;   // 15–30s  盛夏
    const inAct3 = bar >= 8 && bar < 12;  // 30–45s  弄丢
    const inAct4 = bar >= 12 && bar < 17; // 45–63.75 重逢
    const inAct5 = bar >= 17 && bar < 23; // 63.75–86.25 祝福
    const last = bar === 23;         // 86.25–90 定格

    /* 弦垫：每小节一层 */
    PAD(t, ch.pad.map(f => f * (inAct1 ? 1 : 1)), BAR + .6, inAct3 ? .055 : (inAct1 ? .05 : .062));

    /* 钢琴 */
    if(inAct1){
      P(t, ch.root * 2, 2.6, .13);                       // 每小节一个根音
      if(ph === 0) P(t + beat * 2, ch.pad[2] * 2, 2.2, .09);
    }
    if(inAct2 || inAct4){
      const arp = [ch.pad[0] * 2, ch.pad[2], ch.pad[3], ch.pad[2] * 2];
      const vel = inAct4 ? .15 : .11;
      for(let k = 0; k < 8; k++){
        P(t + k * beat / 2, arp[k % 4] * (inAct4 && k > 3 ? 2 : 1), .9, vel * (k % 2 ? .72 : 1));
      }
    }
    if(inAct3){
      P(t, ch.root, 3.2, .10);
      if(bar % 2 === 1) BELL(t + beat * 2, ch.pad[3] * 2, .07);
    }
    if(last){
      P(t, ch.root * 2, 3.4, .14);
      P(t + .1, ch.pad[2] * 2, 3.2, .10);
      P(t + .2, ch.pad[3] * 2, 3.0, .09);
      P(t + .3, ch.pad[1] * 2, 2.8, .08);
    }

    /* 低音 */
    if(inAct4 || inAct5 || last){
      BASS(t, ch.root, BAR * .95, inAct4 ? .16 : .12);
    }

    /* 旋律 */
    if(inAct2 && ph >= 0){
      MEL[ph].forEach(([b, f, d]) => P(t + b * beat, f, d, .16));
    }
    if(inAct4){
      MEL_HI[ph].forEach(([b, f, d]) => P(t + b * beat * .98, f, d, .13));
    }
    if(inAct5){
      const mb = [[0, ch.pad[2] * 2, 1.6], [1.5, ch.pad[3] * 2, 1.3], [2.5, ch.pad[2] * 4, 1.5]];
      mb.forEach(([b, f, d]) => BELL(t + b * beat, f, .10));
      if(ph === 0) MEL[3].forEach(([b, f, d]) => P(t + b * beat, f, d, .12));
    }
  }

  /* ---- 动态：2.5s 淡入；43s 压暗；56s 恢复；89s 收尾 ---- */
  const G = 2.45;
  master.gain.setValueAtTime(0, T0);
  master.gain.linearRampToValueAtTime(G, T0 + 2.5);
  master.gain.setValueAtTime(G, T0 + 43);
  master.gain.linearRampToValueAtTime(G * .68, T0 + 44.2);
  master.gain.setValueAtTime(G * .68, T0 + 55.6);
  master.gain.linearRampToValueAtTime(G, T0 + 57.5);
  master.gain.setValueAtTime(G, T0 + 88.6);
  master.gain.linearRampToValueAtTime(0, T0 + 90.5);

  try{ ctx.resume(); }catch(e){}

  return function stop(){
    try{ master.gain.cancelScheduledValues(ctx.currentTime); }catch(e){}
    try{ master.gain.setTargetAtTime(0, ctx.currentTime, .4); }catch(e){}
    setTimeout(() => { try{ master.disconnect(); }catch(e){} }, 1600);
  };
}

function useAmbient(){
  if(Sound.usingAmbient) return;
  Sound.usingAmbient = true;
  Sound.ambientStop = fallbackAmbient();
}

/** BGM 优先级：gei_某某.mp3 > 现场合成的 90 秒配乐 */
function startAudio(){
  ensureCtx();                       /* 必须在点击的这一拍里创建，否则会被挂起 */
  const bgm = $('bgm');
  if(!bgm) return;
  Sound.bgm = bgm;
  const cands = ['gei_某某.mp3', 'gei_某某.mp4'];
  let i = 0, settled = false;
  bgm.volume = 0;

  const fallback = () => {
    if(settled) return;
    settled = true;
    try{ bgm.pause(); }catch(e){}
    useAmbient();
  };

  const next = () => {
    if(settled) return;
    if(i >= cands.length){ fallback(); return; }
    const src = cands[i++];
    try{ bgm.src = src; }catch(e){ fallback(); return; }
    let p = null;
    try{ p = bgm.play(); }catch(e){ p = null; }
    if(p && typeof p.then === 'function'){
      p.then(() => {
        if(settled) return;
        settled = true;
        Sound.bgmReady = true;
        if(Sound.ambientStop){ try{ Sound.ambientStop(); }catch(e){} Sound.ambientStop = null; Sound.usingAmbient = false; }
        fadeVolume(bgm, Sound.baseVol, 2600);
      }).catch(() => { next(); });
    }else{
      setTimeout(() => {
        if(settled) return;
        if(bgm.readyState >= 2 && !bgm.paused){
          settled = true; Sound.bgmReady = true;
          fadeVolume(bgm, Sound.baseVol, 2600);
        }else next();
      }, 900);
    }
  };
  next();
  /* 兜底：2.6s 内什么都没响，就上合成音 */
  setTimeout(() => { if(!settled) fallback(); }, 2600);
}

function duckBgm(factor, ms){
  if(Sound.bgm && Sound.bgmReady) fadeVolume(Sound.bgm, Sound.baseVol * factor, ms || 600);
}
function unduckBgm(ms){
  if(Sound.bgm && Sound.bgmReady) fadeVolume(Sound.bgm, Sound.baseVol, ms || 1200);
}

/** 播放台词；失败时让对应元素抖一下，绝不报错 */
function playVoice(url, fallbackText){
  return new Promise(resolve => {
    let done = false;
    const finish = (ok) => {
      if(done) return;
      done = true;
      unduckBgm(1000);
      resolve(ok);
    };
    const shakeTarget = () => {
      try{
        const list = Array.from(document.querySelectorAll('.bubble'));
        const hit = list.reverse().find(n => n.textContent.trim() === String(fallbackText || '').trim()) || list[0];
        if(hit){
          hit.classList.add('shake');
          setTimeout(() => hit.classList.remove('shake'), 760);
        }
      }catch(e){}
    };
    let a;
    try{ a = new Audio(); }catch(e){ shakeTarget(); finish(false); return; }
    a.preload = 'auto';
    a.setAttribute('playsinline', '');
    a.volume = 1;
    const timer = setTimeout(() => { try{ a.pause(); }catch(e){} shakeTarget(); finish(false); }, 9000);
    a.addEventListener('ended', () => { clearTimeout(timer); finish(true); }, { once: true });
    a.addEventListener('error', () => { clearTimeout(timer); shakeTarget(); finish(false); }, { once: true });
    a.src = url;
    duckBgm(.55, 500);
    let p = null;
    try{ p = a.play(); }catch(e){ p = null; }
    if(p && typeof p.catch === 'function'){
      p.catch(() => { clearTimeout(timer); shakeTarget(); finish(false); });
    }
  });
}

   15 · Timeline
   ============================================================ */

class Timeline{
  constructor(totalMs){
    this.total = totalMs || 0;
    this.events = [];
    this.t = 0;
    this.playing = false;
    this.fired = new Set();
    this.finishCbs = [];
    this.catchup = false;
    this._raf = null;
    this._last = 0;
    this._done = false;
  }
  at(timeMs, fn){
    this.events.push({ ms: Math.max(0, timeMs | 0), fn });
    this.events.sort((a, b) => a.ms - b.ms);
    return this;
  }
  onFinish(cb){ this.finishCbs.push(cb); return this; }

  _dispatch(upTo){
    for(let i = 0; i < this.events.length; i++){
      const e = this.events[i];
      if(e.ms <= upTo && !this.fired.has(i)){
        this.fired.add(i);
        try{ e.fn(); }catch(err){ /* 静默：任何单点失败都不许打断全片 */ }
      }
    }
  }

  play(){
    if(this.playing) return;
    if(this.t >= this.total) this.t = 0;
    this.playing = true;
    this._done = false;
    this._last = performance.now();
    const loop = (now) => {
      if(!this.playing) return;
      const dt = now - this._last;
      this._last = now;
      this.t = Math.min(this.total, this.t + dt);
      this._dispatch(this.t);
      if(this.t >= this.total && !this._done){
        this._done = true;
        this.playing = false;
        this.finishCbs.forEach(cb => { try{ cb(); }catch(e){} });
        return;
      }
      this._raf = requestAnimationFrame(loop);
    };
    this._raf = requestAnimationFrame(loop);
  }

  pause(){
    this.playing = false;
    if(this._raf) cancelAnimationFrame(this._raf);
  }

  seek(ms, fireMissed = true){
    const was = this.playing;
    this.pause();
    this.t = clamp(ms, 0, this.total);
    this._done = false;
    if(!fireMissed){
      this.fired = new Set(this.events.map((e, i) => e.ms <= this.t ? i : -1).filter(i => i >= 0));
      if(was) this.play();
      return this;
    }
    this.fired = new Set();
    this.catchup = true;
    this._dispatch(this.t);
    this.catchup = false;
    if(was) this.play();
    return this;
  }
}

let __palette = ['#dfe9ff', '#9fb6e0', '#ffffff'];   // particleWipe 用的当前幕色板

function anim(el, frames, dur, easing = 'linear', fill = 'forwards'){
  if (!el || !el.animate) { return Promise.resolve(); }
  const a = el.animate(frames, { duration: Math.max(1, dur), easing, fill });

/* 极轻的"叮"（打字机 / 点亮用） */
function blip(freq = 1568, vel = .06, dur = .18){
  try {
    const ctx = ensureCtx();
    if (!ctx || ctx.state !== 'running') return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vel, t + .008);
    g.gain.exponentialRampToValueAtTime(.0006, t + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}

/* ---------- 1. 节拍网格 ---------- */
class BeatGrid{
  constructor({ bpm = 55, offsetMs = 0, beatsPerBar = 4 } = {}){
    this.bpm = bpm; this.offset = offsetMs; this.bpb = beatsPerBar;
    this.beatMs = 60000 / bpm;
    this.barMs = this.beatMs * beatsPerBar;
  }
  beat(n){ return Math.round(this.offset + n * this.beatMs); }
  bar(n){ return Math.round(this.offset + n * this.barMs); }
  q(ms){ return Math.round(this.offset + Math.round((ms - this.offset) / this.beatMs) * this.beatMs); }
  beatInBar(b, k){ return this.beat(b * this.bpb + k); }
}

/* ---------- 2. 圆形擦除 ---------- */
async function irisWipe({ color = '#04060e', durationMs = 900, fromXY = [50, 50], reverse = false } = {}){
  const el = $('iris');
  if (!el) return;
  const [x, y] = fromXY;
  el.style.background = color;
  el.style.opacity = '1';
  if (reverse){
    // 圆从全屏收缩，揭示下面的新幕
    el.style.clipPath = `circle(150% at ${x}% ${y}%)`;
    if (__cut) { const f = __cut; __cut = null; f(); }
    await anim(el, [{ clipPath: `circle(150% at ${x}% ${y}%)` }, { clipPath: `circle(0% at ${x}% ${y}%)` }],
               durationMs, 'cubic-bezier(.55,0,.2,1)');
  } else {
    el.style.clipPath = `circle(0% at ${x}% ${y}%)`;
    await anim(el, [{ clipPath: `circle(0% at ${x}% ${y}%)` }, { clipPath: `circle(150% at ${x}% ${y}%)` }],
               durationMs * .5, 'cubic-bezier(.5,0,.7,.3)');
    if (__cut) { const f = __cut; __cut = null; f(); }
    await waitMs(40);
    await anim(el, [{ clipPath: `circle(150% at ${x}% ${y}%)` }, { clipPath: `circle(0% at ${x}% ${y}%)` }],
               durationMs * .5, 'cubic-bezier(.2,.6,.3,1)');
  }
  el.style.opacity = '0';
}

async function glitchCut({ durationMs = 700, slices = 8 } = {}){
  const w = $('world'), n = $('noise');
  if (n) n.style.opacity = '.5';
  if (w) w.style.animation = 'glitchWorld .16s steps(1) infinite';
  await waitMs(durationMs * .5);
  if (__cut) { const f = __cut; __cut = null; f(); }
  await waitMs(durationMs * .2);

  await waitMs(durationMs * .3);

}

/* ---------- 4. 冲刺变焦 ---------- */
async function zoomBlur({ durationMs = 800, scaleTo = 1.18, blurTo = 14, dir = 0 } = {}){
  const w = $('world');
  if (!w) return;
  await anim(w, [{ transform: 'scale(1)', filter: 'blur(0px)' },
                 { transform: `scale(${scaleTo})`, filter: `blur(${blurTo}px)` }],
             durationMs * .5, 'cubic-bezier(.45,0,.85,.4)');
  if (__cut) { const f = __cut; __cut = null; f(); }
  w.style.transform = `scale(${scaleTo * .88})`;
  w.style.filter = `blur(${blurTo * .8}px)`;
  await anim(w, [{ transform: `scale(${scaleTo * .88})`, filter: `blur(${blurTo * .8}px)` },
                 { transform: 'scale(1)', filter: 'blur(0px)' }],
             durationMs * .62, 'cubic-bezier(.15,.7,.2,1)');
  w.style.transform = ''; w.style.filter = '';
}

/* ---------- 5. 粒子消散 ---------- */
async function particleWipe({ durationMs = 1100, particleCount = 900, windDeg = 70 } = {}){
  const c = $('ambC'); if (!c) return;
  const ctx = c.getContext('2d');
  const rad = windDeg * Math.PI / 180;
  const P = [];
  const cols = (__palette && __palette.length) ? __palette : ['#dfe9ff', '#9fb6e0', '#ffffff'];
  for (let i = 0; i < particleCount; i++){
    P.push({
      x: Math.random() * 100, y: Math.random() * 177.8,
      vx: Math.cos(rad) * rand(9, 34), vy: Math.sin(rad) * rand(7, 30) + rand(-7, 7),
      s: rand(.12, .5), a: rand(.3, 1), col: cols[(Math.random() * cols.length) | 0]
    });
  }
  const t0 = performance.now();
  let cut = false;
  return new Promise(res => {
    const f = (dt, now) => {
      const k = Math.min(1, (now - t0) / durationMs);
      if (!cut && k > .42) { cut = true; if (__cut) { const fn = __cut; __cut = null; fn(); } }
      ctx.clearRect(0, 0, 100, 177.8);
      for (const p of P){
        p.x += p.vx * dt * .001 * (1 + k * 1.6);
        p.y += p.vy * dt * .001 * (1 + k * 1.6) - dt * .002;
        ctx.globalAlpha = p.a * (1 - k * .85);
        ctx.fillStyle = p.col;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.s * (1 - k * .3), 0, 6.2832); ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (k >= 1){ Ticker.remove(f); clearCanvas(c); res(); }
    };
    Ticker.add(f);
  });
}

/* ---------- 6. 暖光泄漏 ---------- */
async function lightLeak({ color = '#ffb066', durationMs = 1400, driftDeg = 15 } = {}){
  const el = $('leak'); if (!el) return;
  el.style.background = `linear-gradient(${102 + driftDeg}deg, transparent 36%, rgba(255,190,120,0) 42%,
    ${color}88 49%, rgba(255,244,222,.92) 52%, ${color}77 55%, rgba(255,190,120,0) 62%, transparent 68%)`;
  el.style.opacity = '0';
  await anim(el, [
    { transform: 'translate3d(-70%, 18%, 0) rotate(-2deg)', opacity: '0' },
    { opacity: '1', offset: .35 },
    { transform: 'translate3d(70%, -12%, 0) rotate(2deg)', opacity: '0' }
  ], durationMs, 'ease-in-out');
  el.style.opacity = '0';
}

/* ---------- 7. 节拍频闪 ---------- */
function shutterFlash({ count = 4, everyBeat = true, color = '#ffffff', peakAlpha = .55 } = {}){
  const el = $('flash'); if (!el) return;
  const gap = everyBeat ? (BEAT(1) - BEAT(0)) : 240;
  for (let i = 0; i < count; i++){
    setTimeout(() => {
      el.style.background = color;
      el.animate([{ opacity: 0 }, { opacity: peakAlpha, offset: .18 }, { opacity: 0 }],
                 { duration: 240, easing: 'ease-out' });
    }, i * gap);
  }
}

/* ---------- 8. 照片肯·伯恩斯 ---------- */
function kenBurns(el, { from = { scale: 1, x: 0, y: 0 }, to = { scale: 1.08, x: -2, y: -1 }, durationMs = 8000 } = {}){
  if (!el) return null;
  const mk = v => `translate3d(${v.x}%, ${v.y}%, 0) scale(${v.scale})`;
  return anim(el, [{ transform: mk(from) }, { transform: mk(to) }], durationMs, 'linear');
}

/* ---------- 9. 打字机气泡 ---------- */
async function typewriteBubble(anchorEl, text, { side = 'top', color = '#cfe3ff', charMs = 65, popMs = 260, holdMs = 2900 } = {}){
  const host = $('bubbles'); if (!host) return;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.style.setProperty('--c', color);
  b.style.setProperty('color', color);
  b.innerHTML = '<span class="txt"></span><span class="caret">|</span>';
  host.appendChild(b);

  const ar = anchorEl ? anchorEl.getBoundingClientRect() : stageEl.getBoundingClientRect();
  const sr = stageEl.getBoundingClientRect();
  const ax = ar.left + ar.width / 2 - sr.left;
  const ay = ar.top - sr.top + (side === 'bottom' ? ar.height : 0);
  b.style.left = ax + 'px';
  b.style.top = (side === 'bottom' ? ay : ay - 6) + 'px';

  await waitMs(30);
  b.classList.add('on');
  await waitMs(popMs);

  const txt = b.querySelector('.txt');
  for (const ch of Array.from(text)){
    txt.textContent += ch;
    blip(1400 + Math.random() * 500, .035, .12);
    await waitMs(charMs);
  }
  const caret = b.querySelector('.caret');
  if (caret) caret.style.display = 'none';
  await waitMs(holdMs);
  b.classList.remove('on');
  await waitMs(760);
  b.remove();
}

/* ---------- 10. 上浮萤火 / 孔明灯 ---------- */
function createEmbers(canvas, { count = 26, colors = ['#ffb45e', '#ff8c5a', '#ffd98a'], riseSpeed = [.8, 2.2], sway = 3 } = {}){
  const ctx = canvas.getContext('2d');
  let P = [], running = false, dens = 1;
  const H = 177.8, W = 100;

  function mk(){
    const near = Math.random();
    return {
      x: rand(4, W - 4), y: rand(H * .55, H + 4),
      r: .18 + near * .5,
      v: rand(riseSpeed[0], riseSpeed[1]) * (.5 + near),
      ph: rand(0, 6.28), sp: rand(.5, 1.4),
      a: rand(.35, .95), col: colors[(Math.random() * colors.length) | 0]
    };
  }
  function rebuild(){
    const n = Math.round(count * dens);
    P = []; for (let i = 0; i < n; i++) P.push(mk());
  }
  function frame(dt){
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (const p of P){
      p.y -= p.v * dt * .012;
      p.ph += dt * .0011 * p.sp;
      const x = p.x + Math.sin(p.ph) * sway;
      const flick = .72 + .28 * Math.sin(p.ph * 3.1);
      if (p.y < -4){ const q = mk(); q.y = H + 4; Object.assign(p, q); }
      const g = ctx.createRadialGradient(x, p.y, 0, x, p.y, p.r * 3.4);
      g.addColorStop(0, p.col); g.addColorStop(.35, p.col + 'aa'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = p.a * flick;
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, p.y, p.r * 3.4, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  const wrapped = (dt) => { if (running) frame(dt); };
  rebuild();
  return {
    start(){ if (running) return; running = true; Ticker.add(wrapped); },
    stop(){ running = false; Ticker.remove(wrapped); ctx.clearRect(0, 0, W, H); },
    setDensity(n){ dens = Math.max(0, n); rebuild(); },
    destroy(){ this.stop(); P = []; }
  };
}

/* ---------- 11. 烟花 ---------- */
function fireworkBurst(canvas, x, y, { color = '#ffd166', rays = 60, lifeMs = 1400, gravity = .06 } = {}){
  const ctx = canvas.getContext('2d');
  const P = [];
  for (let i = 0; i < rays; i++){
    const a = (i / rays) * 6.2832 + rand(-.05, .05);
    const sp = rand(9, 26);
    P.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, r: rand(.12, .34) });
  }
  const t0 = performance.now();
  const f = (dt, now) => {
    const k = (now - t0) / lifeMs;
    ctx.globalCompositeOperation = 'lighter';
    ctx.clearRect(0, 0, 100, 177.8);
    for (const p of P){
      p.x += p.vx * dt * .001; p.y += p.vy * dt * .001;
      p.vy += gravity * dt * .06; p.vx *= .995; p.vy *= .995;
      p.life = 1 - k;
      if (p.life <= 0) continue;
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 6);
      g.addColorStop(0, '#fff'); g.addColorStop(.3, color); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = Math.max(0, p.life) * .95;
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 6, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    if (k >= 1){ Ticker.remove(f); clearCanvas(canvas); }
  };
  Ticker.add(f);
}

/* ---------- 12. 风疾线 ---------- */
function createWindStreaks(canvas, { count = 40, speed = [24, 60], alpha = .18, color = '#9db4d8' } = {}){
  const ctx = canvas.getContext('2d');
  let S = [], running = false, dir = 1, boost = 1;
  function mk(init){
    return {
      x: init ? rand(0, 100) : (dir > 0 ? rand(-18, -2) : rand(102, 118)),
      y: rand(0, 177.8), len: rand(8, 34), v: rand(speed[0], speed[1]),
      a: alpha * rand(.5, 1.3), th: rand(.08, .22)
    };
  }
  function rebuild(){ S = []; for (let i = 0; i < count; i++) S.push(mk(true)); }
  function frame(dt){
    ctx.clearRect(0, 0, 100, 177.8);
    ctx.strokeStyle = color; ctx.lineCap = 'round';
    for (const s of S){
      s.x += dir * s.v * boost * dt * .001;
      if (dir > 0 && s.x > 118){ Object.assign(s, mk(false)); }
      if (dir < 0 && s.x < -18){ Object.assign(s, mk(false)); }
      ctx.globalAlpha = s.a;
      ctx.lineWidth = s.th;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - dir * s.len, s.y + .6); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  const wrapped = (dt) => { if (running) frame(dt); };
  rebuild();
  return {
    start(){ if (running) return; running = true; Ticker.add(wrapped); },
    stop(){ running = false; Ticker.remove(wrapped); ctx.clearRect(0, 0, 100, 177.8); },
    flip(){ dir *= -1; },
    setBoost(b){ boost = b; },
    destroy(){ this.stop(); S = []; }
  };
}

/* ---------- 舞台基础 ---------- */
function fitAll(){
  const u = U();
  document.documentElement.style.setProperty('--u', u + 'px');
  ['moteC', 'snowC', 'leafC', 'rainC', 'ambC', 'fireC', 'trailC', 'textC'].forEach(id => {
    const c = $(id); if (!c) return;
    const r = stageEl.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    c.width = Math.round(r.width * dpr);
    c.height = Math.round(r.height * dpr);
    c.style.width = r.width + 'px';
    c.style.height = r.height + 'px';
    const ctx = c.getContext('2d');
    ctx.setTransform(dpr * u, 0, 0, dpr * u, 0, 0);
  });
}

function gatherDust(x, y, n = 34, color = '#ffd9a0', ms = 1000){
  const host = document.getElementById('fx') || stageEl;
  const r = stageEl.getBoundingClientRect();
  const bx = r.left + r.width * x / 100, by = r.top + r.height * y / 100;
  for (let i = 0; i < n; i++){
    const d = document.createElement('i');
    const a = Math.random() * Math.PI * 2, dist = r.width * (0.18 + Math.random() * 0.32);
    const sx = Math.cos(a) * dist, sy = Math.sin(a) * dist * 0.9;
    const sz = 2 + Math.random() * 4;
    d.style.cssText = 'position:fixed;left:' + (bx - r.left) + 'px;top:' + (by - r.top) + 'px;width:' + sz + 'px;height:' + sz + 'px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.95),' + color + ' 55%,transparent 72%);z-index:16;opacity:0';
    host.appendChild(d);
    const delay = Math.random() * 260;
    d.animate([
      { transform: 'translate(' + sx + 'px,' + sy + 'px) scale(.5)', opacity: 0 },
      { opacity: .95, offset: .45 },
      { transform: 'translate(0,0) scale(.2)', opacity: 0 }
    ], { duration: ms, delay, easing: 'cubic-bezier(.3,.1,.2,1)', fill: 'forwards' });
    setTimeout(() => d.remove(), ms + delay + 80);
  }
}

/* ===== 播放倍速 & 播完自动回标题 ===== */
const RATE = 1.0;
/* 只保留《给某某》一条音源：关掉合成配乐与全部音效 */
try {
  fallbackAmbient = function(){ return function(){}; };
  blip = function(){};
  window.__audioLock = true;
} catch (e) {}
(function patchMedia(){
  try {
    const orig = HTMLMediaElement.prototype.play;
    HTMLMediaElement.prototype.play = function(){
      try { this.playbackRate = RATE; this.defaultPlaybackRate = RATE; } catch (e) {}
      return orig.apply(this, arguments);
    };
  } catch (e) {}
})();
(function patchRate(){
  Timeline.prototype.play = function(){
    if (this.playing) return;
    if (this.t >= this.total) this.t = 0;
    this.playing = true; this._done = false; this._last = performance.now();
    const loop = (now) => {
      if (!this.playing) return;
      const dt = now - this._last; this._last = now;
      this.t = Math.min(this.total, this.t + dt * RATE);
      this._dispatch(this.t);
      if (this.t >= this.total && !this._done){
        this._done = true; this.playing = false;
        this.finishCbs.forEach(cb => { try { cb(); } catch (e) {} });
        return;
      }
      this._raf = requestAnimationFrame(loop);
    };
    this._raf = requestAnimationFrame(loop);
  };
})();

function setAct(a){
  if (S.act === a) return;
  S.act = a;
  ACTS.forEach(x => stageEl.classList.remove(x));
  stageEl.classList.add(a);
  try { document.body.style.backgroundColor = EDGE[a] || '#080b16'; } catch (e) {}
  // 切幕时清掉上一幕残留的文案（每个 .act 容器 + 内部 .line）
  ACTS.forEach(x => {
    if (x === a) return;
    const box = $(x);
    if (box){
      box.classList.remove('on');
      box.querySelectorAll('.line').forEach(l => l.classList.remove('on'));
    }
  });
}

let __bdUrl = null;
function setBackdrop(url){
  const bd = $('backdrop'); if (!bd) return;
  if (url === __bdUrl) return;
  __bdUrl = url;
  if (!url){ bd.style.opacity = 0; return; }
  bd.style.opacity = 0;
  setTimeout(() => {
    bd.style.backgroundImage = 'url("' + url + '")';
    bd.style.opacity = .92;
  }, 170);
}

const EDGE = { a1:'#0b1026', a2:'#8a6a2c', a3:'#5b4426', a4:'#16283c', a5:'#101a2c', a6:'#5d1f18', a7:'#101a3a', a8:'#151a34', a9:'#0d1120', a10:'#0b1026' };

function showPhoto(key, { zoom = 1, x = 0, y = 0, dur = 9000, pz = null } = {}){
  Object.values(PHOTOS).forEach(p => {
    const el = $(p.el);
    if (el) el.classList.remove('on');
  });
  if (!key) return;
  const P = PHOTOS[key]; if (!P) return;
  const el = $(P.el); if (!el) return;
  if (pz) el.style.setProperty('--pz', pz);
  if (S.kb && S.kb.cancel) { try { S.kb.cancel(); } catch (e) {} }
  el.style.transform = 'none';
  el.classList.add('on');
  S.kb = kenBurns(el, { from: { scale: 1, x: 0, y: 0 }, to: { scale: zoom, x, y }, durationMs: dur });
  __palette = P.pal;
  setBackdrop(P.src || ('bg_' + key + '.jpg'));
}

/* 折返途中的轻微 pulse（每拍一次） */
function tl_schedulePulse(ms){
  const at = ms - 0;
  setTimeout(() => {
    const p = $('pool'); if (!p) return;
    p.animate([{ opacity: 1 }, { opacity: .78 }, { opacity: 1 }], { duration: 420, easing: 'ease-out' });
  }, Math.max(0, at));
}

/* ---------- 开场 / 交互 ---------- */
function startSession(){
  const tl = buildTimeline();
  startAudio();
  timeline.play();
  /* PAUSE_AT */
  if (window.__pauseAt){ const __pa=setInterval(()=>{ if(!timeline||timeline.t>=window.__pauseAt){ clearInterval(__pa); timeline.pause&&timeline.pause(); } },50); }
  setTimeout(() => { $('replay') && $('replay').classList.remove('on'); }, 200);
}

function init(){
  stageEl = $('stage');

  // 照片
  Object.entries(PHOTOS).forEach(([k, v]) => {
    const el = $(v.el);
    if (el) el.style.backgroundImage = `url("${v.src}")`;
  });

  fitAll();
  buildStars();
  if ($('moon')) $('moon').style.opacity = '.75';

  // 粒子系统
  S.snow = createSnow($('snowC'), { layers: 3, counts: [70, 46, 22], wind: .35, drift: true });
  S.snow.start(); S.snow.setDensity(1);
  S.leaves = createLeaves($('leafC'), { count: 42, colors: ['#e8c86a', '#f0c060', '#c9b45a'] });
  S.leaves.start(); S.leaves.setDensity(0);
  S.rain = createRain($('rainC')); S.rain.start(); S.rain.setIntensity(0);
  S.motes = createMotes($('moteC')); S.motes.start();
  S.embers = createEmbers($('ambC'), { count: 26 });
  S.wind = createWindStreaks($('rainC'), { count: 34, speed: [30, 70], alpha: .12 });

  // 让共享的视差逻辑作用到新的粒子系统
  snowCtl = S.snow; leafCtl = S.leaves; rainCtl = S.rain; moteCtl = S.motes;

  // 视差
  window.addEventListener('pointermove', (e) => {
    parX = (e.clientX / window.innerWidth - .5) * 2;
    parY = (e.clientY / window.innerHeight - .5) * 2;
    queueParallax();
  }, { passive: true });

  // 点击炸雪雾
  stageEl.addEventListener('pointerdown', (e) => {
    if (!timeline || !timeline.playing) return;
    const r = stageEl.getBoundingClientRect();
    burstAt((e.clientX - r.left) / U(), (e.clientY - r.top) / U(),
      { count: 14, color: '#dbe7ff', spreadMs: 700 });
  });

  // 开场遮罩
  const gate = $('gate'), btn = $('startBtn');
  if (gate) gate.classList.add('on');
  const go = () => {
    window.__userStarted = true;
    try { const a = document.querySelector('audio'); if (a) a.playbackRate = RATE; } catch (e) {}
    if (gate) gate.style.opacity = '0';
    setTimeout(() => gate && gate.remove(), 700);
    startSession();
  };
  if (btn) btn.addEventListener('click', go);
  if (gate) gate.addEventListener('click', (e) => { if (e.target === gate) go(); });

  // 键盘
  window.addEventListener('keydown', e => {
    if (e.key === 'r' || e.key === 'R'){
      location.reload();
    }
  });

  // 调试参数
  const qs = new URLSearchParams(location.search);
  const t = qs.get('t');
  const freeze = qs.get('freeze') === '1';
  const auto = qs.get('autoplay') === '1';
  const pauseAt = qs.get('pause');
  if (pauseAt) window.__pauseAt = +pauseAt;
  if (freeze) document.documentElement.classList.add('instant');

  if (t !== null && !isNaN(+t)){
    const tl = buildTimeline();
    FROZEN = freeze;
    if (gate) gate.remove();
    tl.seek(+t, true);
    if (!freeze && auto){ startAudio(); tl.play(); }
    else if (!freeze) { /* 停在指定帧 */ }
  } else if (auto){
    if (gate) gate.remove();
    FROZEN = false;
    buildTimeline();
    startAudio();
    timeline.play();
  }

  window.__dongzhi = {
    get timeline(){ return timeline; },
    get state(){
      const bgm = $('bgm');
      return { act: S.act, ambient: !!(Sound && Sound.usingAmbient),
               bgmVolume: bgm ? bgm.volume : 0, t: timeline ? timeline.t : 0 };
    },
    snow: () => S.snow, leaves: () => S.leaves,
    seek: (ms) => timeline && timeline.seek(ms, true),
    grid: GRID, BEAT, BAR
  };
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

</script>
</body>
</html>
